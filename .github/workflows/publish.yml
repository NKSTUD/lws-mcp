name: Publish

# Publishing a GitHub release (tag vX.Y.Z) uploads the package to PyPI through Trusted Publishing: no token stored.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package and server.json versions
        run: |
          tag="${{ github.event.release.tag_name }}"
          test "v$(uv version --short)" = "$tag"
          test "v$(jq -r .version server.json)" = "$tag"
          test "v$(jq -r '.packages[0].version' server.json)" = "$tag"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lws-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Listing in the official MCP Registry (registry.modelcontextprotocol.io), after PyPI has the version:
  # the registry checks the package and the "mcp-name" line of its README. GitHub OIDC, no secret.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - name: Publish (retried while PyPI propagates the new version)
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            sleep 30
          done
          exit 1
