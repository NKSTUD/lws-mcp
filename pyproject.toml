[project]
name = "lws-mcp"
version = "0.1.0"
description = "MCP server for the LWS (lws.fr) API: manage domains, DNS zones, hosting and your account from any AI assistant."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nouhan Kourouma" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "lws", "dns", "domains", "hosting", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://github.com/NKSTUD/lws-mcp"
Issues = "https://github.com/NKSTUD/lws-mcp/issues"
Changelog = "https://github.com/NKSTUD/lws-mcp/blob/main/CHANGELOG.md"

[project.scripts]
lws-mcp = "lws_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
